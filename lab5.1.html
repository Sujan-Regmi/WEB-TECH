<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Information Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      background: #fff;
      padding: 20px;
    }
    table {
      border-collapse: collapse;
      width: 600px;
    }
    th {
      background-color: #b0b0e8;
      border: 1px solid #999;
      padding: 10px 16px;
      font-weight: bold;
      font-size: 20px;
      text-align: center;
    }
    td {
      border: 1px solid #999;
      padding: 10px 16px;
      vertical-align: middle;
    }
    td.label-cell {
      width: 45%;
      background: #fff;
    }
    td.value-cell {
      width: 55%;
      background: #fff;
    }
    input[type="text"] {
      width: 100%;
      padding: 3px 5px;
      font-size: 16px;
      border: 1px solid #aaa;
      box-sizing: border-box;
    }
    select {
      font-size: 16px;
      padding: 2px 4px;
    }
    .radio-group, .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 18px;
    }
    .radio-group label, .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .full-row td {
      padding: 10px 16px;
      border: 1px solid #999;
    }
    textarea {
      width: 100%;
      height: 130px;
      font-size: 16px;
      border: 1px solid #aaa;
      resize: vertical;
      box-sizing: border-box;
      margin-top: 4px;
    }
    .btn-row td {
      text-align: center;
      border: 1px solid #999;
      padding: 10px;
      background: #fff;
    }
    button {
      font-size: 16px;
      padding: 6px 20px;
      background: #d4d4d4;
      border: 2px outset #aaa;
      cursor: pointer;
    }
    button:active {
      border-style: inset;
    }
  </style>
</head>
<body>
<table>
  
  <tr>
    <th>Name</th>
    <th>Value</th>
  </tr>
  
  <tr>
    <td class="label-cell">Name</td>
    <td class="value-cell">
      <input type="text" name="name" />
    </td>
  </tr>
  
  <tr>
    <td class="label-cell">Sex</td>
    <td class="value-cell">
      <div class="radio-group">
        <label><input type="radio" name="sex" value="male" /> Male</label>
        <label><input type="radio" name="sex" value="female" checked /> Female</label>
      </div>
    </td>
  </tr>
  
  <tr>
    <td class="label-cell">Eye color</td>
    <td class="value-cell">
      <select name="eye_color">
        <option value="green" selected>green</option>
        <option value="blue">blue</option>
        <option value="brown">brown</option>
        <option value="hazel">hazel</option>
        <option value="gray">gray</option>
      </select>
    </td>
  </tr>
  
  <tr>
    <td class="label-cell">Check all that apply</td>
    <td class="value-cell">
      <div class="checkbox-group">
        <label><input type="checkbox" name="tall" /> Over 6 feet tall</label>
        <label><input type="checkbox" name="heavy" /> Over 200 pounds</label>
      </div>
    </td>
  </tr>
  
  <tr class="full-row">
    <td colspan="2">
      Describe your athletic ability:<br/>
      <textarea name="athletic_ability"></textarea>
    </td>
  </tr>
  
  <tr class="btn-row">
    <td colspan="2">
      <button type="submit">Enter my information</button>
    </td>
  </tr>
</table>
</body>
</html>
