<!DOCTYPE html>
<html>
<head>
  <title>Color Examples</title>
</head>
<body>

  <h1 style="color: red;">This text uses Color Name (red)</h1>

  <h1 style="color: #ff5733;">This text uses Hex Code (#ff5733)</h1>

  <h1 style="color: rgb(0, 128, 255);">This text uses RGB (0, 128, 255)</h1>

  <h1 style="color: rgba(255, 0, 0, 0.5);">This text uses RGBA (255, 0, 0, 0.5)</h1>

  <h1 style="color: hsl(120, 100%, 35%);">This text uses HSL (120, 100%, 35%)</h1>

</body>
</html>
