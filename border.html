<!DOCTYPE html>
<html>
<head>
    <title>Background and Border Example</title>

    <style>
        body{
            background-color: lightgray;
            background-image: linear-gradient(to right, lightblue, lightgreen);
        }

        h1{
            background-color: white;
            border: 5px solid red;
            padding: 10px;
            text-align: center;
        }

        .box1{
            background-color: yellow;
            border: 3px dashed blue;
            padding: 15px;
            margin: 10px;
        }

        .box2{
            background-color: pink;
            border: 4px dotted green;
            padding: 15px;
            margin: 10px;
        }

        .box3{
            background-color: lightcoral;
            border: 8px  purple;
            padding: 15px;
            margin: 10px;
        }

        .box4{
            background-color: lightyellow;
            border: 5px ridge green;
            padding: 20px;
            margin: 20px
        }

    </style>
</head>

<body>

    <h1>Background and Border Properties Example</h1>

    <div class="box1">Solid background + Dashed border</div>
    <div class="box2">Pink background + Dotted border</div>
    <div class="box3">Colored background + Groove border</div>
    <div class="box4">Light background + Ridge border</div>

</body>
</html>
