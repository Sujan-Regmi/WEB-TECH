<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="welcome.html">
        <label for="Name">

        Name:
        <br>
        <input type="text" name="name" id="name">
        <br><br>
        </label>

        Email:
        <br>
        <input type="email" name="email" id="email" value="sujan@example.com">
        <br><br>

        Password:
        <br>
        <input type="password" name="password" id="password">
        <br><br>

        Age:
        <br>
        <input type="number" name="age" id="age" placeholder="15-20" min="15" max="20">
        <br><br>

        Date of Birth:
        <br>
        <input type="date" name="dob" id="dob">
        <br><br>

        URL:
        <br>
        <input type="url" name="url" id="url">
        <br><br>

        Search:
        <br>
        <input type="search" name="search" id="search">
        <br><br>

        Week:
        <br>
        <input type="week" name="week" id="week">
        <br><br>

        Favourite Color:
        <br>
        <input type="color" name="color" id="color">
        <br><br>

        Address:
        <br>
        <select name="address" id="address">
            <option value="kathmandu">Kathmandu</option>
            <option value="lalitpur">Lalitpur</option>
            <option value="bhaktapur">Bhaktapur</option>
            <option value="pokhara" selected>Pokhara</option>
        </select>
        <br><br>

        Gender:
        <br>
        <input type="radio" name="gender" id="male" value="male" checked>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="other" value="other">
        <label for="other">Other</label>
        <br><br>
        Photo:
        <br>
        <input type="file" name="" id="" accept="image/*" multiple> 
        <br><br>
        CV:
        <br>
        <input type="file" name="" id="" accept=".pdf,.doc">
        <br><br>
         Marks:
          <input type="range" name="" id="" min="0" max="100">
          <br><br>
        Hobby:
        <br>
        <input type="checkbox" name="hobby" id="reading" value="reading">
        <label for="reading">Reading</label>
        <br>
        <input type="checkbox" name="hobby" id="gaming" value="gaming">
        <label for="gaming">Gaming</label>
        <br>
        <input type="checkbox" name="hobby" id="coding" value="coding" checked>
        <label for="coding">Coding</label>
        <br>
        <input type="checkbox" name="hobby" id="travelling" value="travelling">
        <label for="travelling">Travelling</label>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
</body>
</html>
