<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NCIT College</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1a1a1a;
      color: #ffffff;
      text-align: center;
      padding: 18px 20px;
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }

    nav {
      background-color: #2c2c2c;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 4px;
      flex: 1;
    }

    nav ul li a {
      color: #dddddd;
      text-decoration: none;
      font-size: 0.95rem;
      font-family: Georgia, serif;
      font-style: italic;
      padding: 4px 10px;
      display: block;
    }

    nav ul li a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    nav .search-box {
      margin-left: auto;
    }

    nav .search-box input {
      padding: 4px 8px;
      border: 1px solid #888;
      background: #f0f0f0;
      font-size: 0.85rem;
      width: 160px;
      outline: none;
    }
    main {
      flex: 1;
      background-color: #d0d0d0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 40px 30px;
      gap: 20px;
      min-height: 300px;
    }

    .col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      font-style: italic;
      font-size: 1.05rem;
      color: #111;
    }

    .col.center {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .col.right {
      align-items: flex-end;
      text-align: right;
    }

    .col p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .image-placeholder {
      width: 160px;
      height: 120px;
      background-color: #bbb;
      border: 2px dashed #888;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-style: italic;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    footer {
      background-color: #1a1a1a;
      color: #dddddd;
      text-align: center;
      padding: 14px 20px;
      font-style: italic;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>NCIT College</h1>
  </header>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Gallery</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <div class="search-box">
      <input type="text" placeholder="Search..." />
    </div>
  </nav>
  <main>
    <div class="col">
      <p>About<br>Yourself</p>
    </div>
    <div class="col center">
      <div class="image-placeholder">Image</div>
    </div>
    <div class="col right">
      <p>About<br>Yourself</p>
    </div>
  </main>
  <footer>
    &copy; Pokhara University
  </footer>

</body>
</html>
