<!DOCTYPE html>
<html>
<head>
<style>
table{
    width: 100%;
    border-collapse: collapse;
    text-align: center;
}

th,td{
    border: 1px solid black;
    padding: 10px;
}

tr:nth-child(even){
    background: #f2f2f2;
}

tr:hover{
    background: yellow;
}
</style>
</head>
<body>

<table>
<tr>
    <th>Name</th>
    <th>Age</th>
    <th>City</th>
</tr>

<tr>
    <td>Ram</td>
    <td>20</td>
    <td>Kathmandu</td>
</tr>

<tr>
    <td>Sita</td>
    <td>21</td>
    <td>Lalitpur</td>
</tr>

<tr>
    <td>Hari</td>
    <td>22</td>
    <td>Bhaktapur</td>
</tr>

</table>

</body>
</html>
