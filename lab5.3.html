<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #40e0d0;
      font-family: "Courier New";
      padding: 20px;
      margin: 0;
    }
    h1 {
      font-size: 55px;
      font-weight: 900;
      text-decoration: underline;
    }
    .box {
      border: 2px solid black;
      padding: 30px 40px;
      width: 60%;
      margin: 80px auto 0;
      background: url('https://thumbs.dreamstime.com/b/close-up-baby-s-face-eye-6089595.jpg') center/cover no-repeat;
    }
    .row {
      margin-bottom: 20px;
      font-size: 15px;
    }
    .row input {
      width: 200px;
      height: 26px;
      background: white;
      border: 1px solid #ccc;
    }
    .btn-wrap {
      text-align: center;
      margin-top: 10px;
    }
    .btn-wrap button {
      padding: 5px 25px;
      font-size: 14px;
      background: #e0e0e0;
      border: 2px outset #aaa;
      cursor: pointer;
    }
    .forgot {
      text-align: center;
      margin-top: 12px;
      font-size: 16px;
    }
    .forgot a {
      color: blue;
      text-decoration: none;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>User login.....</h1>
  <div class="box">
    <div class="row">Enter Name &nbsp;&nbsp;&nbsp;&nbsp;: <input type="text" /></div>
    <div class="row">Enter Password : <input type="password" /></div>
    <div class="btn-wrap"><button>Login</button></div>
    <div class="forgot"><a href="#">Forget password</a></div>
  </div>
</body>
</html>
