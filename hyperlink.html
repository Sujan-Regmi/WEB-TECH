<!DOCTYPE html>
<html>
<head>
    <title>Hyperlink Types</title>
</head>
<body>

    <h1>Hyperlink Example</h1>

    <a href="#section1">Intra-page Link (Go to Section)</a><br><br>

    <a href="about.html">Inter-page Link (Go to Another Page)</a><br><br>

    <a href="https://www.wikipedia.org" target="_blank">External Link</a><br><br>

    <a href="mailto:example@gmail.com">Email Link</a><br><br>

    <hr>

    <h2 id="section1">Intra-page Section</h2>
    <p>This is an example of intra-page navigation using id.</p>

</body>
</html>
