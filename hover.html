<!DOCTYPE html>
<html>
<head>
    <title>Hover Example</title>
<style>
  a:link{
            color:red;
        }
        a:visited{
            color:blue;
        }

        a:hover{
            color: yellow;
            font-size: 150%;
            background-color: black;
            font-family: monospace;
            text-decoration: underline wavy;
        }

        a:active{
            color:green;
        }
    </style>
</head>
<body>
    <a href="#">I live in Nepal</a><br><br>
    <a href="#">I live in Nepal</a><br><br>
    <a href="#">I live in Nepal</a><br><br>
    <a href="#">I live in Nepal</a><br><br>
    <a href="#">I live in Nepal</a><br><br>
    <a href="#">I live in Nepal</a><br><br>
</body>
</html>
