<!DOCTYPE html>
<html>
<head>
<style>

a:link{color:blue;}
a:visited{color:purple;}
a:hover{color:red;}
a:active{color:green;}

input:focus{background:yellow;}

li:first-child{color:red;}
li:last-child{color:green;}
li:nth-child(2){color:blue;}

</style>
</head>
<body>

<a href="#">Link</a>

<br><br>

<input type="text" placeholder="Focus here">

<ul>
    <li>One</li>
    <li>Two</li>
    <li>Three</li>
</ul>

</body>
</html>
