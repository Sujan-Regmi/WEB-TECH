<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin: 0;
    font-family: Arial;
    background: #fff3e0;
}

.container{
    width: 80%;
    margin: 20px auto;
    padding: 2em;
    background: #ffeb3b;
    border: 4px solid #ff5722;
    border-radius: 10px;
}

h1{
    font-size: 2rem;
    text-align: center;
    color: #d50000;
}

.box{
    width: 50vw;
    height: 20vh;
    margin: 20px auto;
    padding: 1em;
    background: #00e676;
    border: 3px solid #1b5e20;
    font-size: 18px;
    color: #000;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.small-text{
    font-size: 0.8em;
    color: #0d47a1;
}
</style>
</head>
<body>

<div class="container">
    <h1>CSS Units Example</h1>

    <div class="box">
        <p class="small-text">Using em, rem, vw, vh units</p>
    </div>
</div>

</body>
</html>
